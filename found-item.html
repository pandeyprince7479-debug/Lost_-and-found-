    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="main-header">
        <div class="logo-area">
            <img src="LPU.png" alt="LPU Logo" class="logo">
            <h1>LPU FindHub</h1>
        </div>
        <nav class="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="search.html">Search Items</a></li>
                <li><a href="lost-item.html">Report Lost</a></li>
                <li><a href="found-item.html">Report Found</a></li>
                <li><a href="reviews.html">Reviews</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="report-section">
            <h2>Report a Found Item</h2>
            <p>Help us return this item to its rightful owner by providing the details below.</p>
            
            <form action="submit_found_item.php" method="POST" enctype="multipart/form-data" class="report-form">
                <div class="form-group">
                    <label for="item-name">Item Name:</label>
                    <input type="text" id="item-name" name="item_name" required placeholder="e.g., Black Wallet, Wireless Earbuds">
                </div>

                <div class="form-group">
                    <label for="category">Category:</label>
                    <select id="category" name="category" required>
                        <option value="">Select a category</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Documents">Documents/IDs</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Clothing">Clothing/Bags</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="location">Found at:</label>
                    <input type="text" id="location" name="location" required placeholder="e.g., Block 20 Canteen, Near Main Gate">
                </div>

                <div class="form-group">
                    <label for="date-found">Date Found:</label>
                    <input type="date" id="date-found" name="date_found" required>
                </div>

                <div class="form-group">
                    <label for="time-found">Time Found:</label>
                    <input type="time" id="time-found" name="time_found">
                </div>

                <div class="form-group">
                    <label for="photo">Upload an Image:</label>
                    <input type="file" id="photo" name="photo" accept="image/*" required>
                </div>

                <div class="form-group">
                    <label for="description">Detailed Description:</label>
                    <textarea id="description" name="description" rows="5" required placeholder="Describe the item's appearance, brand, or any distinguishing marks to help the owner identify it."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-btn">Submit Found Report</button>
                    <button type="reset" class="cancel-btn">Cancel</button>
                </div>
            </form>
        </section>
    </main>

</html>
