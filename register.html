<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LPU FindHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="main-header">
        <div class="logo-area">
            <img src="LPU.png" alt="LPU Logo" class="logo">
            <h1>LPU FindHub</h1>
        </div>
        <nav class="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="search.html">Search Items</a></li>
                <li><a href="lost-item.html">Report Lost</a></li>
                <li><a href="found-item.html">Report Found</a></li>
                <li><a href="reviews.html">Reviews</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="auth-section">
            <h2>Create Your Account</h2>
            <form action="register_process.php" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="first-name">First Name:</label>
                    <input type="text" id="first-name" name="first_name" required placeholder="John">
                </div>
                <div class="form-group">
                    <label for="last-name">Last Name:</label>
                    <input type="text" id="last-name" name="last_name" required placeholder="Doe">
                </div>
                <div class="form-group">
                    <label for="email">University Email:</label>
                    <input type="email" id="email" name="email" required placeholder="student@lpu.in">
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required placeholder="Create a password">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password:</label>
                    <input type="password" id="confirm-password" name="confirm_password" required placeholder="Repeat your password">
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the Terms and Conditions and Privacy Policy.</label>
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
            </form>
            <p>Already have an account? <a href="login.html">Login here</a>.</p>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Lovely Professional University. All rights reserved.</p>
            <nav class="footer-links">
                <a href="index.html">Home</a>
                <a href="search.html">Search</a>
                <a href="reviews.html">Reviews</a>
                <a href="contact.html">Support</a>
            </nav>
        </div>
    </footer>

</body>
</html>
